spring.application.name=leave-management
server.port=8080

# ---------- MySQL ----------
# Values come from environment variables (VS Code reads them from D:\Java-learn\.env).
# The database must exist; Flyway creates and upgrades the tables (src/main/resources/db/migration).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:leave_management_db}
spring.datasource.username=${DB_USERNAME:leave_app}
spring.datasource.password=${DB_PASSWORD:}

# Tables are owned by Flyway, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Paging ----------
spring.data.web.pageable.max-page-size=100

# ---------- Security ----------
# First HR account, created on startup only if no HR user exists yet
app.admin.email=${ADMIN_EMAIL:admin@company.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.security.bcrypt-strength=10

# ---------- Actuator / API docs ----------
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Leave Management
info.app.version=@project.version@
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Logging ----------
logging.level.com.icici.leavemanagement=INFO
