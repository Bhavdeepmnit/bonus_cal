spring.application.name=leave-management
server.port=8081

# ---------- MySQL ----------
# Values come from environment variables (VS Code reads them from D:\Java-learn\.env).
# The database must exist; Flyway creates and upgrades the tables (src/main/resources/db/migration).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:leave_management_db}
spring.datasource.username=${DB_USERNAME:leave_app}
spring.datasource.password=${DB_PASSWORD:}

# Tables are owned by Flyway, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Paging ----------
spring.data.web.pageable.max-page-size=100

# ---------- Security ----------
# First HR account, created on startup only if no HR user exists yet
app.admin.email=${ADMIN_EMAIL:admin@company.com}
app.admin.password=${ADMIN_PASSWORD}
app.security.bcrypt-strength=10

# ---------- Bonus calculation ----------
# Formula: max(0, base + approved reimbursement reward - leave/reimbursement penalties)
app.bonus.base-amount=${BONUS_BASE_AMOUNT:1000.00}
app.bonus.applied-leave-penalty=${BONUS_APPLIED_LEAVE_PENALTY:5.00}
app.bonus.approved-leave-day-penalty=${BONUS_APPROVED_LEAVE_DAY_PENALTY:10.00}
app.bonus.rejected-leave-penalty=${BONUS_REJECTED_LEAVE_PENALTY:20.00}
app.bonus.pending-leave-penalty=${BONUS_PENDING_LEAVE_PENALTY:5.00}
app.bonus.reimbursement-frequency-penalty=${BONUS_REIMBURSEMENT_FREQUENCY_PENALTY:2.00}
app.bonus.approved-reimbursement-reward-rate=${BONUS_APPROVED_REIMBURSEMENT_REWARD_RATE:0.02}
app.bonus.pending-reimbursement-penalty=${BONUS_PENDING_REIMBURSEMENT_PENALTY:10.00}
app.bonus.rejected-reimbursement-penalty=${BONUS_REJECTED_REIMBURSEMENT_PENALTY:15.00}

# ---------- Actuator / API docs ----------
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Leave Management
info.app.version=@project.version@
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
# OpenAPI file for Postman import: /v3/api-docs (JSON) or /v3/api-docs.yaml

# ---------- Logging ----------
logging.level.com.icici.leavemanagement=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
