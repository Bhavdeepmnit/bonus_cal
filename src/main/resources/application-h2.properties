# In-memory database instead of MySQL (no install needed). Data is lost when the app stops.
spring.datasource.url=jdbc:h2:mem:leave_management_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.admin.email=${ADMIN_EMAIL:admin@company.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
